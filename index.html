<!DOCTYPE html>
<html>
<head>
  <title>Rivermark College | Admission Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6fa;
      color: #333;
    }

    header {
      background: linear-gradient(90deg, #002147, #004080);
      color: white;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      background-image: url('college.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 140px 20px;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 33, 71, 0.75);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero h2 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons button {
      padding: 14px 30px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .apply-btn {
      background-color: #f9a825;
      color: white;
    }

    .prospectus-btn {
      background-color: #004080;
      color: white;
    }

    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      padding: 50px 20px;
      background: white;
      text-align: center;
    }

    .stats div h2 {
      color: #004080;
      font-size: 30px;
      margin: 0;
    }

    footer {
      background: #002147;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 14px;
    }

    df-messenger {
      --df-messenger-button-titlebar-color: #004080;
      --df-messenger-user-message: #004080;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 Rivermark College</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Programs</a>
    <a href="#">Admissions</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>Welcome to Rivermark College</h2>
    <p>Admissions Open for B.Tech, MCA, and BCA Programs</p>

    <div class="buttons">
      <button class="apply-btn">Apply Now</button>
      <button class="prospectus-btn">Download Prospectus</button>
    </div>
  </div>
</section>

<section class="stats">
  <div>
    <h2>95%</h2>
    <p>Placement Rate</p>
  </div>
  <div>
    <h2>B.Tech</h2>
    <p>Engineering Program</p>
  </div>
  <div>
    <h2>MCA</h2>
    <p>Computer Applications</p>
  </div>
  <div>
    <h2>BCA</h2>
    <p>Computer Science Foundation</p>
  </div>
</section>

<footer>
  © 2026 Rivermark College | Admission Helpdesk
</footer>

<!-- DIALOGFLOW CHATBOT (DO NOT REMOVE) -->
<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<df-messenger
  intent="WELCOME"
  chat-title="Rivermark Admission Assistant"
  agent-id="3f11d9e5-0dfa-44d0-8209-81d2dce8e4bb"
  language-code="en">
</df-messenger>

</body>
</html>
