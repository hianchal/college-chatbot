<!DOCTYPE html>
<html>
<head>
  <title>Rivermark College</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #004aad, #00c6ff);
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      background: rgba(0,0,0,0.3);
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .courses {
      background: white;
      color: black;
      padding: 50px 20px;
      text-align: center;
    }

    .courses h2 {
      margin-bottom: 30px;
    }

    .course-box {
      display: inline-block;
      background: #004aad;
      color: white;
      padding: 20px 40px;
      margin: 15px;
      border-radius: 10px;
      font-size: 20px;
      transition: 0.3s;
    }

    .course-box:hover {
      background: #00c6ff;
      transform: scale(1.05);
    }

    footer {
      background: black;
      padding: 20px;
      text-align: center;
    }

    iframe {
      position: fixed;
      bottom: 20px;
      right: 20px;
    }
  </style>
</head>

<body>

<header>
  Rivermark College
</header>

<section class="hero">
  <h1>Welcome to Rivermark College</h1>
  <p>Empowering Future Tech Leaders</p>
</section>

<section class="courses">
  <h2>Our Technology Programs</h2>
  <div class="course-box">B.Tech</div>
  <div class="course-box">BCA</div>
  <div class="course-box">MCA</div>
</section>

<footer>
  © 2026 Rivermark College | Admissions Open
</footer>

</html>
